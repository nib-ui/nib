name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Read-write cache only for pushes to main. Pull requests (forks included) fall back to the
  # read-only access that `nxCloudId` grants.
  NX_CLOUD_ACCESS_TOKEN: ${{ github.event_name == 'push' && secrets.NX_CLOUD_ACCESS_TOKEN || '' }}

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vitest browser-mode tests run in headless Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      - name: Formatting
        run: pnpm format:check
      - name: Workspace in sync (TS project references)
        run: pnpm nx sync:check
      - name: Version plan for every touched public package
        if: github.event_name == 'pull_request'
        run: pnpm nx release plan:check --base=$NX_BASE --head=$NX_HEAD
      - run: pnpm nx affected -t lint typecheck test build size-limit

  # Screenshots are compared against baselines made in the same image on linux/arm64
  # (scripts/playwright-docker.sh); see ADR 7.
  e2e:
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      # Firefox refuses to start when $HOME is not owned by the (root) user running it.
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      - run: pnpm nx affected -t e2e --output-style=static
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: '**/playwright-report/'
          retention-days: 14
